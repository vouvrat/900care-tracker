services:
  900care:
    build: .
    image: vouvrat/900care-tracker:latest
    container_name: 900care-tracker
    ports:
      - "8000:8000"
    volumes:
      - 900care_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  900care_data:
